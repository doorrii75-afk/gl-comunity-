services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      # Keep installed deps inside the container, not overwritten by host bind
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DISABLE_HMR=false
      # Vite >= 6.1 appends this to allowedHosts; platform injects the value.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    command: sh -c "npm install && npm run dev"
    restart: on-failure
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/api/db-status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  web_node_modules:
